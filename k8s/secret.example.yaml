# Modèle du Secret MySQL : copier ce fichier en secret.yaml,
# remplacer les valeurs, puis : kubectl apply -f secret.yaml
# (secret.yaml est ignoré par Git)
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: travelo
type: Opaque
stringData:
  password: <MOT_DE_PASSE_ROOT_MYSQL>
  SPRING_DATASOURCE_USERNAME: root
  SPRING_DATASOURCE_PASSWORD: <MOT_DE_PASSE_ROOT_MYSQL>   # identique à "password"